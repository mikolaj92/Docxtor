[project]
name = "docxtor"
version = "0.8.9"
description = "Extract editable text segments from documents and inject changed text back in memory."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Docxtor contributors" }
]
dependencies = [
  "pymupdf>=1.24",
  "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.0",
  "reportlab>=4.2.0",
  "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
files = [
  "src/docxtor/docx_comment_mutations.py",
  "src/docxtor/docx_publish.py",
  "src/docxtor/docx_revision_mutations.py",
  "src/docxtor/docx_revisions.py",
  "src/docxtor/docx_review_inventory.py",
  "src/docxtor/docx_review_models.py",
  "src/docxtor/docx_review_transaction.py",
  "src/docxtor/docx_facts.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
